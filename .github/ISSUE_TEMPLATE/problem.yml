name: Something went wrong
description: A tool did something unexpected, or a document is wrong or unclear.
title: "Problem: "
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Write it the way you would tell a colleague at the bench. No technical detail is required; what you saw is enough.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you were doing, what you expected, what happened instead. The exact words on screen help if you have them.
      placeholder: I was running the survey on the Hall drive 3 image and it stopped with "no such file" after about ten minutes.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Which tool or document, and if you know it, which version or page.
      placeholder: LabKit 0.9.5, Survey step; or docs/collaborator-setup.md section 4
    validations:
      required: true
  - type: dropdown
    id: effect
    attributes:
      label: Effect on the lab
      options:
        - Stops work (nobody can proceed)
        - Slows work (there is a way around it)
        - Cosmetic or wording
        - Not sure
    validations:
      required: true
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: Screenshots, a file name, what you tried. Never paste collection content, donor names or accession-derived data here; issues are public.
