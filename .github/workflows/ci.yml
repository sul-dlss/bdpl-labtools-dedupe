name: CI

# Lint + security checks on every pull request and on pushes to main.
# Copied from the BDPL LabTools hub (sul-dlss/bdpl-labtools). Steps that
# need code skip themselves while the repo has none of that kind.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff · shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff lint
        run: |
          files=$(git ls-files '*.py')
          if [ -z "$files" ]; then echo "no Python files; skipping"; exit 0; fi
          pip install --quiet ruff
          ruff check $files
      - name: ShellCheck
        run: |
          files=$(git ls-files '*.sh')
          if [ -z "$files" ]; then echo "no shell files; skipping"; exit 0; fi
          shellcheck $files

  security:
    name: Security (bandit · gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans commit history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bandit (Python security lint, medium+ severity)
        run: |
          files=$(git ls-files '*.py')
          if [ -z "$files" ]; then echo "no Python files; skipping"; exit 0; fi
          pip install --quiet bandit
          bandit --severity-level medium --confidence-level medium $files
      - name: Gitleaks (secret scan)
        # The gitleaks GitHub Action requires a paid license for org repos,
        # so run the open-source binary directly (pinned release).
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
